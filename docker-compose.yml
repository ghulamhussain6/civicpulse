#welcome to orchestration tool
services:
  civic-db:
    image: mongo:4.4.29
    container_name: civic-db
    restart: always  # <--- Added
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - /mnt/remote-backups:/mnt/remote-backups":ro  # Add this line to map the NFS mount

  backend:
    build: ./backend
    container_name: civic-backend
    restart: always  # <--- Added
    env_file:
      - /home/vagrant/civicpulse/.env
    environment:
      - DB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@civic-db:27017/civicpulse?authSource=admin
    ports:
      - "3000:3000" # Required for the Frontend to reach the API
    volumes:
      - /mnt/remote-backups:/app/backups
    depends_on:
      - civic-db

  frontend:
    build: ./frontend
    container_name: civic-frontend
    restart: always  # <--- Added
    volumes: 
       - /home/vagrant/civicpulse/frontend/dist:/usr/share/nginx/html:ro   
      #- ./frontend/dist:/usr/share/nginx/html:z
      #- frontend_data:/usr/share/nginx/html
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: civic-nginx
    restart: always  # <--- Added
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/vagrant/civicpulse/frontend/dist:/usr/share/nginx/html:ro
      #- ./frontend/dist:/usr/share/nginx/html
      #- frontend_data:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /mnt/remote-backups/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend

volumes:
  mongodb_data:
  #frontend_data:
  
