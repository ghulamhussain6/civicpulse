name: CivicPulse Automated Deployment

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Deploy to Docker Compose
        run: |
          # The checkout action puts us in the right folder automatically
          # We just need to run the docker commands
          docker-compose up -d --build
          docker image prune -f
