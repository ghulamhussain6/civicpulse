name: CivicPulse Automated Deployment

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Deploy to Docker Compose
        run: |
          # Use the GITHUB_WORKSPACE variable provided by the runner
          cd ${{ github.workspace }}
          
          # We don't need 'git pull' here because 'actions/checkout' already did it!
          
          # Restart services using the docker-compose.yml in the current folder
          docker-compose up -d --build
          
          # Clean up
          docker image prune -f
