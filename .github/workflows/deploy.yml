name: CivicPulse Automated Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies and Build
        run: |
          cd frontend
          npm ci # Using 'ci' is faster and more reliable for runners
          npm run build 

      - name: Sync Build to Stable Project Folder
        run: |
          # Create the target directory if it doesn't exist
          mkdir -p /home/vagrant/civicpulse/frontend/dist
          # Sync the fresh build to the stable directory
          # Note: Adjust 'frontend/dist/frontend/' if your build output is nested
          rsync -avz --delete frontend/dist/ /home/vagrant/civicpulse/frontend/dist/
          # Ensure Nginx has permission to read the synced files
          chmod -R 755 /home/vagrant/civicpulse/frontend/dist

      - name: Deploy to Docker Compose
        run: |
          # Run from the project root where the valid docker-compose.yml lives
          cd /home/vagrant/civicpulse
          docker-compose up -d --build
          docker image prune -f
