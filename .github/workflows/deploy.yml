name: CivicPulse Automated Deployment

on:
  push:
    branches: [ main ]

env:
  # This fixes the Node.js 20 warning you saw
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Deploy to Docker Compose
        run: |
          # Use the full path to avoid 'command not found' errors
          cd /home/vagrant/civicpulse
          
          # Pull the latest code
          git pull origin main
          
          # Restart services
          docker-compose up -d --build
          
          # Clean up
          docker image prune -f
