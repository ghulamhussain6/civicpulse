name: CivicPulse Automated Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    # This tells GitHub to look for YOUR local runner
    runs-on: self-hosted

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Deploy to Docker Compose
        run: |
          # The runner is already on the VM, so we just run the commands
          cd ~/civicpulse
          git pull origin main
          
          # Rebuild and restart the services
          docker-compose up -d --build
          
          # Clean up unused images to save VM disk space
          docker image prune -f
