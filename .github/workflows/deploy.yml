name: CivicPulse Automated Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies and Build
        run: |
          cd frontend
          npm install --prefer-offline --no-audit
          npm run build -- --configuration production --source-map=false

      - name: Sync Build to Stable Project Folder
        run: |
          # 1. Ensure target exists
          sudo mkdir -p /home/vagrant/civicpulse/frontend/dist
          
          # 2. Find the actual build directory (handles /dist/frontend/browser or /dist/frontend)
          # We look for index.html and get its directory
          BUILD_PATH=$(find frontend/dist -name index.html -exec dirname {} \;)
          echo "Detected build output at: $BUILD_PATH"
          
          # 3. Sync the CONTENT of that folder (note the trailing slash /)
          # We use -L to follow symlinks if any exist
          if [ -n "$BUILD_PATH" ]; then
            sudo rsync -avzL --delete "$BUILD_PATH/" /home/vagrant/civicpulse/frontend/dist/
          else
            echo "Error: Could not find index.html in frontend/dist"
            exit 1
          fi
          
          # 4. Fix permissions
          sudo chmod -R 755 /home/vagrant/civicpulse/frontend/dist

      - name: Deploy to Docker Compose
        run: |
          cd /home/vagrant/civicpulse
          docker-compose up -d --build
          docker image prune -f
          # Force Nginx to reload files from the updated volume
          docker exec civic-nginx nginx -s reload
