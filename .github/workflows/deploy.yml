name: CivicPulse Automated Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies and Build
        run: |
          cd frontend
          npm install --prefer-offline --no-audit
          npm run build -- --configuration production --source-map=false

      - name: Sync Build to Stable Project Folder
        run: |
          # 1. Ensure target exists
          sudo mkdir -p /home/vagrant/civicpulse/frontend/dist
          
          # 2. Find the actual build directory
          BUILD_PATH=$(find frontend/dist -name index.html -exec dirname {} \;)
          echo "Detected build output at: $BUILD_PATH"
          
          # 3. Sync the CONTENT of that folder
          if [ -n "$BUILD_PATH" ]; then
            sudo rsync -avzL --delete "$BUILD_PATH/" /home/vagrant/civicpulse/frontend/dist/
          else
            echo "Error: Could not find index.html in frontend/dist"
            exit 1
          fi
          
          # 4. Fix permissions
          sudo chmod -R 755 /home/vagrant/civicpulse/frontend/dist

      - name: Deploy to Docker Compose
        run: |
          cd /home/vagrant/civicpulse
          docker-compose up -d --build
          # Force Nginx to reload files from the updated volume
          docker exec civic-nginx nginx -s reload

      # =========================================================================
      # NEW AUTOMATED DOCKERHUB STEPS
      # =========================================================================

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and Push Frontend to Docker Hub
        run: |
          # Tag the image that docker-compose just built locally
          docker tag civicpulse-frontend hussainghulam/civicpulse-frontend:latest
          docker tag civicpulse-frontend hussainghulam/civicpulse-frontend:${{ github.sha }}
          
          # Push both tags to Docker Hub
          docker push hussainghulam/civicpulse-frontend:latest
          docker push hussainghulam/civicpulse-frontend:${{ github.sha }}
          
      - name: Tag and Push Backend to Docker Hub  # <-- Added: New block for backend
        run: |
          # Tag the backend image that docker-compose just built locally
          # (Note: Replace 'civicpulse-backend' if your container image is named differently in docker-compose.yml)
          docker tag civicpulse-backend hussainghulam/civicpulse-backend:latest
          docker tag civicpulse-backend hussainghulam/civicpulse-backend:${{ github.sha }}
          
          # Push both backend tags to Docker Hub
          docker push hussainghulam/civicpulse-backend:latest
          docker push hussainghulam/civicpulse-backend:${{ github.sha }}

      - name: Clean Up Local Machine Old Images
        run: |
          docker image prune -f