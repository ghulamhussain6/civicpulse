name: CivicPulse Automated Deployment

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Deploy to Docker Compose
        run: |
          # We are already in the directory where the code was checked out
          # No need to 'cd' into ~/civicpulse or 'git pull'
          
          # Restart services
          docker-compose up -d --build
          
          # Clean up
          docker image prune -f
