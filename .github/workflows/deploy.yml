name: CivicPulse Automated Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'docker-compose.yml'  # Add this!
      - '.github/workflows/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # This is the magic line that turns on caching
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies and Build
        run: |
          cd frontend
          npm install
          # Check your package.json for the correct build script
          npm run build 

      - name: Deploy to Docker Compose
        run: |
          # Now that 'dist' exists, docker-compose can mount it
          docker-compose up -d --build
          docker image prune -f
